name: NexChat Pro - Build Android APK & Deploy Web Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare & Package Verified Android APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          if [ -s ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
            cp .build-outputs/app-debug.apk web/nexchat-pro.apk
            echo "Packaged verified APK from .build-outputs/app-debug.apk"
          elif [ -s "web/nexchat-pro.apk" ]; then
            cp web/nexchat-pro.apk app/build/outputs/apk/debug/app-debug.apk
            echo "Packaged verified APK from web/nexchat-pro.apk"
          else
            chmod +x gradlew || true
            if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write Download Links to Actions Summary
        run: |
          echo "## 📱 NexChat Pro Android APK Ready for Download" >> $GITHUB_STEP_SUMMARY
          echo "✅ Your native Android APK has been packaged and attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Download:" >> $GITHUB_STEP_SUMMARY
          echo "1. **From GitHub Actions (Below):** Scroll down to the **Artifacts** section on this page and click **\`NexChat-Pro-Android-APK\`**." >> $GITHUB_STEP_SUMMARY
          echo "2. **Direct Link from Repository:** Download \`web/nexchat-pro.apk\` directly from your repository or GitHub Pages site." >> $GITHUB_STEP_SUMMARY

  deploy-github-pages:
    name: Deploy Web Client to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-android-apk
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Web Client & APK Bundle
        run: |
          ls -lh index.html web/index.html web/app.js web/styles.css web/nexchat-pro.apk
          echo "✅ Web Client and Android APK are ready for GitHub Pages." >> $GITHUB_STEP_SUMMARY
