name: NexChat Pro - Build Android APK & Deploy Web Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore & Environment Secrets
        run: |
          chmod +x gradlew || true
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi
          ls -la debug.keystore .env

      - name: Build Android Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write Actions Step Summary
        run: |
          echo "## 📱 NexChat Pro Android APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "The native Android APK has been built and attached to this run." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`NexChat-Pro-Android-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scroll down to the **Artifacts** section below to download your APK directly." >> $GITHUB_STEP_SUMMARY

  deploy-github-pages:
    name: Deploy Web Client to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-android-apk
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: NexChat-Pro-Android-APK
          path: app-artifact/
        continue-on-error: true

      - name: Copy Built APK into Web Directory
        run: |
          if [ -f app-artifact/app-debug.apk ]; then
            cp app-artifact/app-debug.apk web/nexchat-pro.apk
            echo "Copied fresh built APK to web/nexchat-pro.apk"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
