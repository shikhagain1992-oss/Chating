<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexChat Pro — Download Android APK & Open Web App</title>
  <meta http-equiv="refresh" content="0; url=web/index.html" />
  <style>
    :root {
      --bg: #0b141a;
      --card: #111b21;
      --primary: #00a884;
      --primary-hover: #06cf9c;
      --text: #e9edef;
      --muted: #8696a0;
      --border: #222e35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    h1 { font-size: 1.75rem; margin-bottom: 8px; color: var(--primary); }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #0b141a;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <h1>NexChat Pro</h1>
    <p>Real-Time Messaging, Status Updates &amp; Full-Screen WebRTC Video Calling for Android &amp; Web</p>
    <a class="btn btn-primary" href="web/nexchat-pro.apk" download="NexChat-Pro.apk">📱 Download Android APK</a>
    <a class="btn btn-outline" href="web/index.html">🌐 Open NexChat Pro Web Client</a>
  </div>
</body>
</html>
